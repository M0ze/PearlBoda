<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — PearlBoda</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="site-nav" aria-label="Main navigation">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo" aria-label="PearlBoda home">Pearl<span>Boda</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="order.html">Order Ride</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-page">
        <div class="dashboard-grid">
            <section class="riders-map-panel">
                <h2>Nearby Riders</h2>
                <div id="map-placeholder" class="map-placeholder">
                    <p>Map view of nearby riders will appear here.</p>
                </div>
            </section>
            
            <aside class="orders-sidebar">
                <h2>Quick Actions</h2>
                <div class="order-actions">
                    <a href="order.html" class="btn btn-primary">Book a Ride</a>
                    <button class="btn btn-outline">Order Delivery</button>
                </div>
                <h3>Active Orders</h3>
                <div id="active-orders" class="active-orders">
                    <p>No active orders.</p>
                </div>
            </aside>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
