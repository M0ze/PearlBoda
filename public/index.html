<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlBoda - Order Boda Rides</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PearlBoda</h1>
            <p>Order a boda boda ride in Hioma, Kampala or Fortportal</p>
        </header>
        <main>
            <form id="rideForm">
                <div class="form-group">
                    <label for="passengerName">Your Name</label>
                    <input type="text" id="passengerName" name="passengerName" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required pattern="[0-9]{9,15}" placeholder="e.g., 256700123456">
                </div>
                <div class="form-group">
                    <label for="pickupCity">Pickup City</label>
                    <select id="pickupCity" name="pickupCity" required>
                        <option value="">-- Select City --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pickupLocation">Pickup Location (optional)</label>
                    <input type="text" id="pickupLocation" name="pickupLocation">
                </div>
                <div class="form-group">
                    <label for="dropoffCity">Dropoff City</label>
                    <select id="dropoffCity" name="dropoffCity" required>
                        <option value="">-- Select City --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dropoffLocation">Dropoff Location (optional)</label>
                    <input type="text" id="dropoffLocation" name="dropoffLocation">
                </div>
                <div class="form-group">
                    <label for="rideTime">Desired Ride Time</label>
                    <input type="datetime-local" id="rideTime" name="rideTime" required>
                </div>
                <button type="submit" class="btn-primary">Order Ride</button>
            </form>
            <div id="formMessage" class="message"></div>
        </main>
        <footer>
            <p>&copy; 2026 PearlBoda. All rights reserved.</p>
        </footer>
    </div>
    <script src="/script.js"></script>
</body>
</html>
